<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video call</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; font-family: -apple-system, sans-serif; overflow: hidden; }
  #remote { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
  #local { position: fixed; right: 12px; top: 12px; width: 28vw; max-width: 160px; border-radius: 8px; background: #111; }
  #status { position: fixed; left: 0; right: 0; top: 40%; text-align: center; color: #ddd; padding: 0 16px; font-size: 20px; }
  .big { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); font-size: 24px; padding: 18px 36px; border: 0; border-radius: 14px; color: #fff; }
  #start { background: #2a7; }
  #hangup { display: none; background: #c33; }
</style>
</head>
<body>
<video id="remote" autoplay playsinline></video>
<video id="local" autoplay playsinline muted></video>
<div id="status">Tap Start to call the baby's room.</div>
<div id="debug" style="position:fixed;left:0;right:0;bottom:2%;text-align:center;color:#8a8;font-size:13px;"></div>
<button id="start" class="big">Start call</button>
<button id="hangup" class="big">Hang up</button>
<script src="peerjs.min.js"></script>
<script>
  // Grandparents open this page with the baby's ID after '#', e.g. call.html#babycall-...
  // The ID is never sent to a server; it only lives in the link.
  var babyId = location.hash.slice(1);
  var remote = document.getElementById('remote');
  var local = document.getElementById('local');
  var statusText = document.getElementById('status');
  var startButton = document.getElementById('start');
  var hangupButton = document.getElementById('hangup');
  var peer = null;
  var localStream = null;
  var currentCall = null;
  var retryTimer = null;

  function setStatus(text) { statusText.textContent = text; }

  function getCameraAndMic() {
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true })
      .catch(function () { return navigator.mediaDevices.getUserMedia({ audio: true }); });
  }

  // A random key stored on this phone, so the baby's phone can recognise it again.
  function deviceKey() {
    try {
      var key = localStorage.getItem('babycall-device-key');
      if (!key) {
        key = Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('babycall-device-key', key);
      }
      return key;
    } catch (e) { return null; }
  }

  // Ends everything: the call, the connection, and this phone's camera and mic.
  function finishCall(message) {
    clearTimeout(retryTimer);
    if (currentCall) { try { currentCall.close(); } catch (e) {} currentCall = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    if (localStream) {
      localStream.getTracks().forEach(function (track) { track.stop(); });
      localStream = null;
    }
    local.srcObject = null;
    remote.srcObject = null;
    hangupButton.style.display = 'none';
    startButton.style.display = '';
    setStatus(message);
  }

  // Small line at the top showing how the connection is doing, in case video doesn't appear.
  function watchCall(call) {
    var debug = document.getElementById('debug');
    var timer = setInterval(function () {
      var pc = call.peerConnection;
      if (!pc) return;
      debug.textContent = 'ice ' + pc.iceConnectionState + ' | conn ' + pc.connectionState +
        ' | sending ' + pc.getSenders().filter(function (s) { return s.track; }).length +
        ' | receiving ' + pc.getReceivers().filter(function (r) { return r.track; }).length +
        ' | video ' + remote.videoWidth + 'x' + remote.videoHeight;
      if (pc.connectionState === 'closed') { clearInterval(timer); debug.textContent = ''; }
    }, 1000);
    call.on('close', function () { clearInterval(timer); debug.textContent = ''; });
  }

  function callBaby() {
    if (!peer || !localStream) return;
    setStatus('Calling… Waiting for the baby’s room to answer.');
    var call = peer.call(babyId, localStream, { metadata: { deviceKey: deviceKey() } });
    currentCall = call;
    watchCall(call);
    call.on('stream', function (stream) {
      remote.srcObject = stream;
      // The baby's room answers at once but only shows its picture once a parent allows it.
      setStatus('Connected. Waiting for a parent to allow the call…');
      setTimeout(function () { if (currentCall === call) setStatus(''); }, 15000);
    });
    call.on('close', function () {
      // No automatic re-calling: a parent has to approve each call on the phone.
      if (currentCall === call) {
        currentCall = null;
        finishCall('The call ended or was not answered. Tap Start to try again.');
      }
    });
    call.on('error', function () { scheduleRetry('Could not reach the baby’s room. Trying again…'); });
  }

  function scheduleRetry(message) {
    setStatus(message);
    clearTimeout(retryTimer);
    retryTimer = setTimeout(callBaby, 5000);
  }

  startButton.addEventListener('click', function () {
    if (!babyId) { setStatus('This link is missing the baby’s ID.'); return; }
    startButton.style.display = 'none';
    setStatus('Starting camera…');
    getCameraAndMic().then(function (stream) {
      localStream = stream;
      local.srcObject = stream;
      hangupButton.style.display = 'block';
      peer = new Peer({ debug: 0 });
      peer.on('open', callBaby);
      peer.on('error', function () { scheduleRetry('Connection problem. Trying again…'); });
    }).catch(function () {
      setStatus('Allow the camera and microphone in Settings, then reload this page.');
      startButton.style.display = '';
    });
  });

  hangupButton.addEventListener('click', function () {
    finishCall('Call ended. Tap Start to call again.');
  });
</script>
</body>
</html>
